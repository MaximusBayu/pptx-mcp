name: CD

# Continuous Deployment for the Max-dev branch.
# On every push to Max-dev: run the full CI suite, then (only if it
# passes) SSH into the VPS and run the DEPLOY.md §11 update flow.
on:
  push:
    branches: [Max-dev]
  workflow_dispatch: {}

# Never run two deploys at once.
concurrency:
  group: deploy-max-dev
  cancel-in-progress: false

jobs:
  # Gate: reuse CI (web unit + engine tests). Deploy only if this passes.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    # Secrets are scoped to a GitHub Environment named "SSH_HOST".
    environment: SSH_HOST
    steps:
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # Fail early with a clear message if a required secret is missing.
          # (GitHub masks values in logs, so an empty echo != empty secret;
          # these checks distinguish "not set" from other failures.)
          : "${SSH_HOST:?is empty/unset - set secret SSH_HOST}"
          : "${SSH_USER:?is empty/unset - set secret SSH_USER}"
          : "${SSH_KEY:?is empty/unset - set secret SSH_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Best-effort; ssh below falls back to accept-new if this is empty.
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
              || echo "ssh-keyscan failed; ssh will use StrictHostKeyChecking=accept-new"
          fi

      - name: Deploy (git sync + compose build/up on the box)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH:-/opt/pptx-mcp}' BRANCH='Max-dev' HEALTHCHECK_URL='${HEALTHCHECK_URL}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          # Prefer the prod override (TLS via Caddy, no exposed internal
          # ports, named volumes). Fall back to plain compose if it's absent.
          if [ -f compose.prod.yml ]; then
            DC="docker compose -f docker-compose.yml -f compose.prod.yml"
          else
            echo "WARNING: compose.prod.yml not found - falling back to docker-compose.yml only."
            echo "WARNING: this publishes postgres/minio/web/engine ports to the public internet,"
            echo "WARNING: uses default credentials, and has no TLS. NOT production-safe."
            DC="docker compose"
          fi

          echo "==> backup (if configured)"
          if [ -x ./ops-backup.sh ]; then ./ops-backup.sh || echo "backup failed, continuing"; else echo "no ops-backup.sh, skipping"; fi

          echo "==> sync code to origin/${BRANCH}"
          git fetch --all --prune
          git checkout -f "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

          echo "==> build"
          $DC build

          echo "==> up (web auto-runs prisma migrate deploy on start)"
          $DC up -d

          echo "==> prune old images"
          docker image prune -f

          echo "==> status"
          $DC ps

          if [ -n "${HEALTHCHECK_URL}" ]; then
            echo "==> health check ${HEALTHCHECK_URL}"
            for i in $(seq 1 20); do
              if curl -fsS --max-time 10 "${HEALTHCHECK_URL}" >/dev/null; then echo "healthy"; exit 0; fi
              sleep 6
            done
            echo "health check did not pass"; $DC logs --tail=80 web; exit 1
          fi
          echo "deploy done"
          REMOTE
